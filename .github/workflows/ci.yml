name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/group-buy-ci
      # CI-only placeholders - never used outside this workflow run.
      JWT_SECRET: ci-test-secret-do-not-use-in-prod-32ch
      JWT_REFRESH_SECRET: ci-test-refresh-secret-do-not-use-32c
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run lint --workspace=api
      - run: npm run test --workspace=api
      - run: npm run test:e2e --workspace=api
      - run: npm run build --workspace=api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run lint --workspace=web
      # next build runs its own TypeScript check as part of the build step.
      - run: npm run build --workspace=web
